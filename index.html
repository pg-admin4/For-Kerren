<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kerren! 🎉</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f3e5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      color: #4a148c;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #7b1fa2;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* Card Box holding hidden message & canvas overlay */
    .scratch-card {
      position: relative;
      width: 100%;
      height: 260px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      background: #ffffff;
      user-select: none;
    }

    /* Underneath Hidden Content */
    .hidden-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #fff0f6 0%, #ffe3ec 100%);
    }

    .hidden-message h2 {
      color: #c2185b;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .hidden-message p {
      color: #4a1525;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .ps-note {
      font-style: italic;
      font-size: 0.85rem;
      color: #880e4f;
      background: #f8bbd0;
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* Top Scratch Canvas Overlay */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Happy Birthday, Kerren! 🎂✨</h1>
    <p class="subtitle">Scratch off the card below to reveal your message 👇</p>

    <div class="scratch-card">
      <!-- Hidden Message -->
      <div class="hidden-message">
        <h2>🎉 Happy Birthday Kerren! 🎉</h2>
        <p>Wishing you an amazing year ahead filled with happiness, success, and everything you've been hoping for!</p>
        <div class="ps-note">
          P.S. Normal people text, but I coded this for you. 😉😂😂<br>— <strong>Angelo</strong>
        </div>
      </div>

      <!-- Scratch Overlay Canvas -->
      <canvas id="scratchCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    let isScratching = false;

    // Set correct Canvas resolution
    function initCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      // Draw shiny overlay layer
      ctx.fillStyle = '#ab47bc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Add text on the scratch surface
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('✨ Scratch Here! ✨', canvas.width / 2, canvas.height / 2);
    }

    // Get touch/mouse coordinates
    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Scratch logic using destination-out
    function scratch(e) {
      if (!isScratching) return;
      e.preventDefault();
      
      const { x, y } = getCoordinates(e);

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 25, 0, Math.PI * 2);
      ctx.fill();
    }

    // Event Listeners for Mouse & Touch
    canvas.addEventListener('mousedown', (e) => { isScratching = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', () => isScratching = false);

    canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); });
    canvas.addEventListener('touchmove', scratch);
    window.addEventListener('touchend', () => isScratching = false);

    window.addEventListener('load', initCanvas);
  </script>
</body>
</html>
